vars:
  fold: k562
experiment_name: replogle_wdataset/k562
seed: 42
run_dir: ${PIE_RUNS_ROOT}/replogle_wdataset/k562
overwrite: false
resume: true
data:
  preprocessed_dirs:
  - hf://datasets/arcinstitute/pie_replogle_nadig_essential@20c9faef76fc96fdc809871340bd93499413dfe7/preprocessed
  dataset_weights: null
  split_dir: data/splits/replogle_wdataset/unseen_ctx/k562
  source_dirs:
    esm2: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/esm2
    ncbi_text: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/ncbi_text
    string_space: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/string_space
    depmap_gene_effect: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/depmap_gene_effect
    context_text: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/context_text
    perturbation_text: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/perturbation_text
  gene_text_dir: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/gene_text
  aliases_path: data/sources/aliases.yaml
  delta_p:
    bin_width_fold_change: 1.1
    max_delta_percentile: 99.9
    max_delta: null
  evidence:
    seed: 42
    chunk: 256
    lfc_clip_percentile: 95.0
  batch_size: 16
  num_workers: 4
  fdr_threshold: 0.05
model:
  d_model: 768
  n_latents: 512
  n_encoder_layers: 4
  n_processor_layers: 6
  n_decoder_layers: 4
  num_heads: 8
  ff_mult: 2
  dropout: 0.1
  drop_src: 0.05
  inference_chunk_size: 2048
  class_weight_cap: 10.0
  class_weight_cap_delta_p: 5.0
  lfc_huber_delta: 1.0
  lfc_target_gene_alpha: 0.001
  lfc_direction_temperature: 0.25
  evidence:
    encoder_dim: 64
    dim: 128
    dropout: 0.1
    response_dropout: 0.25
  temperature:
    de: 4.0
    delta_p: 4.5
optimizer:
  lr: 0.0001
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
scheduler:
  warmup_fraction: 0.05
  constant_steps: 4250
  eta_min: 1.0e-06
trainer:
  accelerator: gpu
  devices: 2
  num_nodes: 1
  precision: bf16-mixed
  max_steps: 5000
  accumulate_grad_batches: 4
  val_every_n_steps: 100
  gradient_clip_val: 10.0
  log_every_n_steps: 50
logger:
  enabled: true
  group: replogle_wdataset
  tags:
  - replogle_wdataset
  - k562
